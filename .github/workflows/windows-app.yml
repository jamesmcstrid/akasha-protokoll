name: Windows-app
on:
  workflow_dispatch:
    inputs:
      whisper_version:
        description: "whisper.cpp-version (tagg)"
        type: string
        default: "v1.9.5"
permissions:
  contents: read
concurrency:
  group: windows-app
  cancel-in-progress: true
jobs:
  bygg:
    # Bara for hand. Fast etikett, sa att maskinens Windows inte byts under steget (windows-latest kan byta).
    # En Windows-minut kostar 1,7 Linux-minuter medan repot ar privat.
    # Kontrollstegen stoppar inte jobbet vid forsta felet (continue-on-error): varje steg skriver OK: eller FEL:, alla
    # kors, loggarna laddas alltid upp, och det sista steget (Sammanfattning) faller jobbet om nagot steg fell.
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      AKASHA_VERSION: "0.2.0"
      AKASHA_BYGGNUMMER: ${{ github.run_number }}
      WHISPER_VERSION: ${{ inputs.whisper_version }}
      # Vulkan SDK (LunarG) som bygger ggml-vulkan.dll. Summan raknades fram av byggmaskinen i korning 10 fran
      # LunarG:s egen adress over HTTPS (den gick inte att jamfora med en publicerad summa), och den last nu sa att
      # en andrad fil marks. SPIRV-Headers (Khronos) behovs for CMake-konfigurationen som SDK:n inte har: last pa
      # den exakta incheckningen for taggen vulkan-sdk-<version>.
      VULKAN_SDK_VERSION: "1.4.309.0"
      VULKAN_SDK_SHA256: "48b132169b64fe65cdb0f20970195335a65354e73f1ea5373032c2a8bbad4297"
      SPIRV_HEADERS_COMMIT: "09913f088a1197aba4aefd300a876b2ebbaa3391"
      # Actions-maskinens konsol ar inte UTF-8: utan detta kraschar ett Python-skript som skriver a-ring, a-prickar,
      # o-prickar eller pilar till en omdirigerad utskrift med UnicodeEncodeError. Skripten staller dessutom in
      # utskriften sjalva.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      # Git Bash skriver annars om argument som borjar med / (till exempel /v till reg och /FI till tasklist).
      MSYS_NO_PATHCONV: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # Sa att Git Bash saker for over argument med a-ring, a-prickar och o-prickar som UTF-8 till Python.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            paketering/krav-bygg.txt
      - name: Visa system
        run: |
          mkdir -p build/loggar
          {
            echo "== Windows"; systeminfo | head -25 || true
            echo "== CMake"; cmake --version | head -1 || true
            echo "== Visual Studio"; "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property catalog_productDisplayVersion || true
            echo "== Python"; python -c "import platform, sys, locale; print(platform.platform(), sys.version); print('filsystemskodning', sys.getfilesystemencoding(), '| locale', locale.getpreferredencoding(False), '| stdout', sys.stdout.encoding)"
            echo "== Kodtabell (chcp)"; chcp.com || true
            echo "== 8.3-namn pa arbetsvolymen (bara information)"; fsutil 8dot3name query D: || true
            echo "== Langa sokvagar (LongPathsEnabled, bara information)"; reg query "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled || true
            echo "== Disk"; df -h . || true
            echo "== Miljo"; echo "RUNNER_TEMP=$RUNNER_TEMP"; echo "NUMBER_OF_PROCESSORS=$NUMBER_OF_PROCESSORS"; echo "PYTHONUTF8=$PYTHONUTF8"
          } 2>&1 | tee build/loggar/system.log
      # Utan faster-whisper och utan PyAV-hjulet fran PyPI (dess FFmpeg ar GPL-bygget med x264, x265 m.fl.): PyAV kommer
      # fran det egna LGPL-bygget nedan. app/requirements.txt (av==12.3.0) galler som forut for terminalinstallationen.
      - name: Beroenden (utan faster-whisper och utan PyAV fran PyPI)
        run: |
          python -m venv build/venv
          grep -v -E '^(faster-whisper|av)==' app/requirements.txt > build/krav.txt
          build/venv/Scripts/python -m pip install -q -r build/krav.txt -r paketering/krav-bygg.txt
      # FFmpeg 6.1.6 (bara LGPL-delar) och PyAV 12.3.0 fran kallkod, som i prova-linux.sh. Cachen: hjulet, licenstexterna
      # (ut/ffmpeg) och kallkodsarkivet (ut/kallkod), med nyckel pa skripten, komponentlistan och verktygens versioner.
      - name: FFmpeg och PyAV ur cachen
        id: ffmpeg
        uses: actions/cache/restore@v6
        with:
          path: build/ffmpeg/ut
          key: ffmpeg-pyav-${{ hashFiles('paketering/bygg-ffmpeg.sh', 'paketering/ffmpeg-komponenter.txt', 'paketering/bygg-pyav.sh', 'paketering/krav-ffmpeg.txt') }}-windows2025-py312
      # FFmpeg byggs i MSYS2 UCRT64 (finns pa byggmaskinen i C:\msys64, inga atgarder fran tredje part) med gcc, nasm och
      # make ur pacman. Skalet ar MSYS2:s bash, inte Git Bash: MSYSTEM valjer UCRT64 och CHERE_INVOKING stannar i repot.
      - name: Bygg FFmpeg (MSYS2 UCRT64)
        id: bygg_ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}
        env:
          MSYSTEM: UCRT64
          CHERE_INVOKING: "1"
        run: |
          # MSYS_NO_PATHCONV (for Git Bash, satt for hela jobbet) galler ocksa MSYS2: utan omskrivningen far gcc /tmp/...
          unset MSYS_NO_PATHCONV
          uname -a
          pacman -Sy --noconfirm --needed make diffutils git xz mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm
          echo "== gcc: ett litet program kompileras, lankas och kors"
          printf 'int main(void) { return 0; }\n' > /tmp/akasha-prov.c
          gcc -v /tmp/akasha-prov.c -o /tmp/akasha-prov.exe -static-libgcc && /tmp/akasha-prov.exe && echo "OK: gcc fungerar"
          mkdir -p build/loggar
          bash paketering/bygg-ffmpeg.sh build/ffmpeg 2>&1 | tee build/loggar/bygg-ffmpeg.log
      - name: Bygg PyAV (MSVC) mot det egna FFmpeg
        id: bygg_pyav
        if: steps.ffmpeg.outputs.cache-hit != 'true' && steps.bygg_ffmpeg.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          bash paketering/bygg-pyav.sh build/ffmpeg python 2>&1 | tee build/loggar/bygg-pyav.log
      - name: Spara FFmpeg och PyAV i cachen
        if: steps.ffmpeg.outputs.cache-hit != 'true' && steps.bygg_pyav.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: build/ffmpeg/ut
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}
      - name: Det egna PyAV-hjulet i byggets venv (aldrig PyPI-hjulet)
        id: pyav
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          build/venv/Scripts/python -m pip install --no-deps --no-index --force-reinstall build/ffmpeg/ut/av-12.3.0-*.whl
          build/venv/Scripts/python -m pip list
          build/venv/Scripts/python paketering/kontrollera_ffmpeg.py --hjul "build/ffmpeg/ut/av-12.3.0-*.whl" 2>&1 | tee build/loggar/kontrollera-ffmpeg-hjul.log
      # Kallkoden till FFmpeg (LGPL): arkivet med bygg-ffmpeg.sh och ffmpeg-komponenter.txt, for releasen bredvid programmet.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ffmpeg-6.1.6-kallkod
          path: build/ffmpeg/ut/kallkod
          retention-days: 7
      - name: Enhetstester
        id: tester
        continue-on-error: true
        env:
          AKASHA_FFMPEG_LGPL: "1"
        run: build/venv/Scripts/python -m unittest discover -s tester --durations 15
      # Bara det kompilerade cachas (nyckel: version + hash av bygg-whisper-cli-windows.sh + Vulkan SDK-versionen + SPIRV-Headers-incheckningen). C-runtime-filerna, fillistan och
      # beroendekontrollen gors av steget Samla whisper-cli efter varje bygge och varje cachetraff, sa att en rattning i
      # verktygen inte tvingar fram ett nytt bygge av whisper.cpp. Med det cachas whisper.cpp:s licens (build/whisper/licens,
      # fran samma kloning), som foljer med programmet.
      - name: whisper-cli ur cachen (det kompilerade)
        id: cli
        uses: actions/cache/restore@v6
        with:
          path: |
            build/whisper/kompilerat
            build/whisper/licens
          key: whisper-cli-win-${{ inputs.whisper_version }}-${{ hashFiles('paketering/bygg-whisper-cli-windows.sh') }}-vulkan${{ env.VULKAN_SDK_VERSION }}-spirv${{ env.SPIRV_HEADERS_COMMIT }}-windows2025
      - name: Vulkan SDK (for bygget av whisper-cli)
        id: vulkan_sdk
        if: steps.cli.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Tyst installation utan tredjepartsaction. Adressen gav 200 och ratt fil i korning 10.
          FIL="$RUNNER_TEMP/vulkansdk-installation.exe"
          ADRESS="https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/windows/VulkanSDK-${VULKAN_SDK_VERSION}-Installer.exe"
          curl -fSL --retry 3 -o "$FIL" "$ADRESS"
          STORLEK="$(wc -c < "$FIL" | tr -d ' ')"
          # sha256sum i Git Bash satter ett bakstreck forst om filnamnet har bakstreck: ta bara summan
          SHA="$(sha256sum < "$FIL" | cut -d' ' -f1)"
          echo "Adress: $ADRESS"
          echo "Storlek: $STORLEK byte"
          echo "sha256: $SHA"
          [ "$SHA" = "$VULKAN_SDK_SHA256" ] || { echo "FEL: sha256 stammer inte, vantade $VULKAN_SDK_SHA256" >&2; exit 1; }
          echo "OK: sha256 stammer med den laste"
          WINROT="C:\\VulkanSDK\\${VULKAN_SDK_VERSION}"
          GITROT="/c/VulkanSDK/${VULKAN_SDK_VERSION}"
          if ! "$FIL" --root "$WINROT" --accept-licenses --default-answer --confirm-command install; then
            echo "FEL: installationen misslyckades. Installationsfilens --help:" >&2
            "$FIL" --help >&2 || true
            exit 1
          fi
          SAKNAS=""
          for F in Bin/glslc.exe Include/vulkan/vulkan.h Lib/vulkan-1.lib; do [ -f "$GITROT/$F" ] || SAKNAS="$SAKNAS $F"; done
          if [ -n "$SAKNAS" ]; then
            echo "FEL: saknas efter installationen:$SAKNAS. Det som finns i $WINROT:" >&2
            find "$GITROT" -maxdepth 3 | head -100 >&2
            exit 1
          fi
          echo "OK: glslc.exe, vulkan.h och vulkan-1.lib finns"
          echo "VULKAN_SDK=$WINROT" >> "$GITHUB_ENV"
          echo "$WINROT\\Bin" >> "$GITHUB_PATH"
          # SPIRV-Headers: ggml-vulkan kraver find_package(SPIRV-Headers CONFIG), som SDK:n inte har. Bygg och installera
          # dem fran den laste incheckningen. Windows-form (C:\...) till CMake och $GITHUB_ENV, /c/... bara till [ -f ].
          SPKALLA="$RUNNER_TEMP/spirv-headers-kalla"
          SPBYGG="$RUNNER_TEMP/spirv-headers-bygg"
          SPWIN="C:\\VulkanSDK\\spirv-headers-${VULKAN_SDK_VERSION}"
          SPGIT="/c/VulkanSDK/spirv-headers-${VULKAN_SDK_VERSION}"
          rm -rf "$SPKALLA" "$SPBYGG"
          git clone --depth 1 --branch "vulkan-sdk-${VULKAN_SDK_VERSION}" https://github.com/KhronosGroup/SPIRV-Headers.git "$SPKALLA"
          SPHEAD="$(git -C "$SPKALLA" rev-parse HEAD)"
          [ "$SPHEAD" = "$SPIRV_HEADERS_COMMIT" ] || { echo "FEL: SPIRV-Headers-incheckningen stammer inte: $SPHEAD, vantade $SPIRV_HEADERS_COMMIT" >&2; exit 1; }
          echo "OK: SPIRV-Headers $SPHEAD"
          cmake -S "$SPKALLA" -B "$SPBYGG" -DSPIRV_HEADERS_ENABLE_TESTS=OFF -DSPIRV_HEADERS_ENABLE_INSTALL=ON
          cmake --install "$SPBYGG" --prefix "$SPWIN"
          SPCONF="$SPGIT/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake"
          if [ ! -f "$SPCONF" ]; then
            echo "FEL: saknas efter installationen av SPIRV-Headers: $SPCONF. Det som finns under $SPWIN:" >&2
            find "$SPGIT" | head -100 >&2
            exit 1
          fi
          echo "OK: $SPCONF finns"
          echo "CMAKE_PREFIX_PATH=$SPWIN" >> "$GITHUB_ENV"
      - name: Bygg whisper-cli
        id: bygg_cli
        if: steps.cli.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          PYTHON=build/venv/Scripts/python bash paketering/bygg-whisper-cli-windows.sh "$WHISPER_VERSION" build/whisper 2>&1 | tee build/loggar/bygg-whisper-cli.log
      - name: Spara whisper-cli i cachen
        if: steps.cli.outputs.cache-hit != 'true' && steps.bygg_cli.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            build/whisper/kompilerat
            build/whisper/licens
          key: ${{ steps.cli.outputs.cache-primary-key }}
      - name: Samla whisper-cli (C-runtime, fillista, beroenden)
        id: samla_cli
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          PYTHON=build/venv/Scripts/python bash paketering/samla-whisper-cli-windows.sh build/whisper/kompilerat build/whisper/ut 2>&1 | tee build/loggar/samla-whisper-cli.log
      - name: Kontrollera whisper-cli
        id: kontroll_cli
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          build/venv/Scripts/python paketering/kontrollera_whisper_cli_windows.py \
            --cli build/whisper/ut/whisper-cli.exe --arbetskatalog "$RUNNER_TEMP/kontroll-whisper-cli" \
            --ordtider-ut build/loggar/ordtider.json 2>&1 | tee build/loggar/kontrollera-whisper-cli.log
      - name: Bygg programmet
        id: bygg
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          AKASHA_FFMPEG_LICENSER: build/ffmpeg/ut/ffmpeg
        run: |
          set -o pipefail
          bash paketering/bygg-windows.sh build/whisper/ut 2>&1 | tee build/loggar/bygg-windows.log
      - name: Kontrollera programmet (uppackat ur zip-filen, från en sökväg med å, ä och ö)
        id: kontroll_program
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          build/venv/Scripts/python paketering/kontrollera.py \
            --program "build/uppackad/Åsa Ölund/Akasha Protokoll/Akasha Protokoll.exe" \
            --hem "$RUNNER_TEMP/Åsa Ölund" --port 8611 \
            --vantad-motor whispercpp --vantat-jobbfel whisper-cli --riktig-rostmodell --fortsatt-efter-fel 2>&1 | tee build/loggar/kontrollera.log
      - name: Kontrollera sökvägar och talare
        id: kontroll_windows
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          ARGUMENT=()
          if [ -f build/loggar/ordtider.json ]; then ARGUMENT=(--ordtider build/loggar/ordtider.json); fi
          build/venv/Scripts/python paketering/kontrollera_windows.py --hem "$RUNNER_TEMP/Åsa Ölund" \
            "${ARGUMENT[@]}" 2>&1 | tee build/loggar/kontrollera-windows.log
      # Installationsfilen byggs efter att zip-kontrollen ar klar, i egna steg med continue-on-error: ett fel hos Inno Setup
      # hindrar aldrig zip-filen.
      - name: Bygg installationsfilen (Inno Setup)
        id: installation
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          build/venv/Scripts/python paketering/bygg_installation.py --version "$AKASHA_VERSION.$AKASHA_BYGGNUMMER" \
            --kalla "dist/Akasha Protokoll" --ikon build/app/ikon.ico --ut dist 2>&1 | tee build/loggar/bygg-installation.log
      - name: Kontrollera installationen (tyst installation under Åäö, kontrollera.py, tyst avinstallation)
        id: kontroll_installation
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          build/venv/Scripts/python paketering/kontrollera_installation.py --installation dist/Akasha-Protokoll-installation.exe \
            --katalog "$RUNNER_TEMP/Installerat Åäö/Akasha Protokoll" --hem "$RUNNER_TEMP/Hem för installationen Åäö" \
            --version "$AKASHA_VERSION.$AKASHA_BYGGNUMMER" --port 8611 --logg-katalog build/loggar 2>&1 | tee build/loggar/kontrollera-installation.log
      - name: Kontrollsummor (SHA256SUMS.txt)
        id: summor
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          build/venv/Scripts/python paketering/kontrollsummor.py dist/SHA256SUMS.txt \
            dist/Akasha-Protokoll-windows-x64.zip dist/Akasha-Protokoll-installation.exe 2>&1 | tee build/loggar/kontrollsummor.log
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          path: dist/Akasha-Protokoll-windows-x64.zip
          archive: false
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          path: dist/Akasha-Protokoll-installation.exe
          archive: false
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          path: dist/SHA256SUMS.txt
          archive: false
          retention-days: 7
      - name: Sammanfattning
        if: ${{ always() }}
        env:
          BYGG_FFMPEG: ${{ steps.bygg_ffmpeg.outcome }}
          BYGG_PYAV: ${{ steps.bygg_pyav.outcome }}
          PYAV: ${{ steps.pyav.outcome }}
          TESTER: ${{ steps.tester.outcome }}
          BYGG_CLI: ${{ steps.bygg_cli.outcome }}
          SAMLA_CLI: ${{ steps.samla_cli.outcome }}
          KONTROLL_CLI: ${{ steps.kontroll_cli.outcome }}
          BYGG: ${{ steps.bygg.outcome }}
          KONTROLL_PROGRAM: ${{ steps.kontroll_program.outcome }}
          KONTROLL_WINDOWS: ${{ steps.kontroll_windows.outcome }}
          INSTALLATION: ${{ steps.installation.outcome }}
          KONTROLL_INSTALLATION: ${{ steps.kontroll_installation.outcome }}
          SUMMOR: ${{ steps.summor.outcome }}
        run: |
          fel=0
          for rad in "Bygg FFmpeg (skipped betyder ur cachen)=$BYGG_FFMPEG" "Bygg PyAV (skipped betyder ur cachen)=$BYGG_PYAV" \
                     "Det egna PyAV-hjulet=$PYAV" "Enhetstester=$TESTER" "Bygg whisper-cli (skipped betyder ur cachen)=$BYGG_CLI" "Samla whisper-cli=$SAMLA_CLI" "Kontroll av whisper-cli=$KONTROLL_CLI" \
                     "Bygg av programmet=$BYGG" "Kontroll av programmet=$KONTROLL_PROGRAM" "Sökvägar och talare=$KONTROLL_WINDOWS" \
                     "Bygg av installationsfilen=$INSTALLATION" "Kontroll av installationen=$KONTROLL_INSTALLATION" "Kontrollsummor=$SUMMOR"; do
            namn="${rad%=*}"
            utfall="${rad##*=}"
            echo "$namn: ${utfall:-ej körd}"
            if [ "$utfall" = failure ] || [ -z "$utfall" ]; then fel=1; fi
          done
          if [ "$fel" -ne 0 ]; then
            echo "FEL: minst ett steg föll eller kördes inte (se raderna ovan och loggen för det steget)"
            exit 1
          fi
          echo "OK: alla steg lyckades"
      - name: Samla loggar
        if: ${{ always() }}
        run: |
          mkdir -p build/loggar
          HEM="$RUNNER_TEMP/Åsa Ölund"
          # Loggfilen letas upp (programkatalogen kan heta Akasha Meet eller Akasha Protokoll beroende pa hur langt kontrollen kom).
          N=0
          while IFS= read -r f; do
            N=$((N + 1)); cp "$f" "build/loggar/programlogg-$N.log" 2>/dev/null || true
          done < <(find "$HEM" -name 'akasha-protokoll.log' 2>/dev/null)
          cp "$HEM/program-utskrift.log" "$HEM/program-utskrift-andra.log" build/loggar/ 2>/dev/null || true
          cp build/app/pyinstaller.log build/app/*.txt build/loggar/ 2>/dev/null || true
          cp build/app/pyi/*/warn-*.txt build/loggar/ 2>/dev/null || true
          cp -R build/app/pyi/akasha-protokoll/licenser build/loggar/ 2>/dev/null || true
          cp build/whisper/*.log build/loggar/ 2>/dev/null || true
          cp build/ffmpeg/bygg/configure.log build/loggar/ffmpeg-configure.log 2>/dev/null || true
          ls -lR build/ffmpeg/ut build/ffmpeg/prefix/bin > build/loggar/ffmpeg-filer.txt 2>&1 || true
          cp build/whisper/src/CMakeLists.txt build/loggar/whisper-CMakeLists.txt 2>/dev/null || true
          cp build/whisper/bygg/CMakeCache.txt build/loggar/whisper-CMakeCache.txt 2>/dev/null || true
          ls -lR build/whisper/kompilerat > build/loggar/whisper-kompilerat-filer.txt 2>&1 || true
          ls -lR build/whisper/ut > build/loggar/whisper-ut-filer.txt 2>&1 || true
          ls -l dist > build/loggar/dist-filer.txt 2>&1 || true
          ls -lR build/uppackad > build/loggar/uppackad-filer.txt 2>&1 || true
          ls -l build/loggar
          # Det viktigaste skrivs ocksa ut har (de sista 300 raderna var), sa att det gar att lasa i jobbloggen utan att
          # ladda ned artefakten.
          visa() { echo; echo "=============== $1 ==============="; if [ -f "$2" ]; then tail -n 300 "$2"; else echo "(saknas: $2)"; fi; }
          echo; echo "=============== akasha-protokoll.log under $HEM ==============="
          find "$HEM" -name 'akasha-protokoll.log' 2>/dev/null | while IFS= read -r f; do visa "loggfil: $f" "$f"; done
          [ "$(find "$HEM" -name 'akasha-protokoll.log' 2>/dev/null | wc -l)" -gt 0 ] || { echo "(ingen akasha-protokoll.log hittades; kataloger under hemkatalogen:)"; find "$HEM" -maxdepth 5 -type d 2>/dev/null | head -n 60; }
          visa "program-utskrift.log" "$HEM/program-utskrift.log"
          visa "program-utskrift-andra.log" "$HEM/program-utskrift-andra.log"
          echo; echo "=============== pe-importer.txt: filer med FEL eller SAKNAS, och whisper-cli.exe, whisper.dll, sherpa och onnxruntime ==============="
          if [ -f build/app/pe-importer.txt ]; then
            wc -l build/app/pe-importer.txt
            grep -E 'SAKNAS|FEL' build/app/pe-importer.txt | head -n 100 || true
            awk '/^[^ ]/ { p = ($0 ~ /whisper-cli\.exe|whisper\.dll|_sherpa_onnx|sherpa-onnx-c-api|onnxruntime\.dll/) } p' build/app/pe-importer.txt | head -n 300
          else
            echo "(saknas)"
          fi
          echo; echo "=============== PyInstallers varningsfil (utan missing module named numpy._core.*) ==============="
          VARNING="$(ls build/app/pyi/*/warn-*.txt 2>/dev/null | head -n 1)"
          if [ -n "$VARNING" ]; then grep -v 'missing module named numpy\._core\.' "$VARNING" | tail -n 300; else echo "(saknas)"; fi
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: loggar
          path: build/loggar
          retention-days: 7

  signera:
    # Kodsignering med SignPath (gratis for oppen kallkod, om SignPath Foundation godkanner projektet). Jobbet kors
    # aldrig nu (if: false) och har inga steg som kors, inga hemligheter och inga atgarder fran tredje part.
    # Det som ska sta har nar projektet ar godkant:
    #   1. ladda ned den osignerade zip-filen som jobbet bygg laddade upp (artefakten),
    #   2. SignPaths GitHub-atgard for signeringsbegaran, med organisation, projekt och policy som variabler (vars.*)
    #      och API-nyckeln som repots hemlighet. Konfigurationen hos SignPath anger vilka filer som signeras:
    #      Akasha Protokoll.exe, _internal/whisper/*.exe och *.dll (byggda i bygg-jobbet), aldrig andras filer,
    #   3. ladda upp den signerade zip-filen som artefakt.
    # Bygget i jobbet bygg andras inte.
    needs: bygg
    if: false
    runs-on: windows-2025
    steps:
      - name: Platshållare, körs aldrig
        run: echo "Signeringen är inte påslagen"
